# AEGIS backend on Render (free tier).
# Deploys from the GitHub repo — no Docker needed (native Python runtime).
# User sets GEMINI_API_KEY in the Render dashboard (sync:false = never in git).
services:
  - type: web
    name: aegis-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: USE_REAL
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GEMINI_API_KEY
        sync: false
