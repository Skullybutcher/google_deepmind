# AEGIS frontend on Netlify (free tier).
# /api/* proxies to the Render backend -> same origin, no CORS needed.
# AFTER the first Render deploy, replace RENDER_BACKEND_URL below with the
# real service URL (https://aegis-backend-xxxx.onrender.com) and redeploy.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# PROD FIX: Netlify's /api proxy BUFFERS streaming responses, so SSE
# (/api/events) delivers zero bytes through it (REST endpoints work fine).
# Bake the backend origin into the frontend at build time instead — all API
# calls go directly to Render (CORS is allow_origins=*, verified live).
[build.environment]
  VITE_API_BASE = "https://aegis-backend-5l4g.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://aegis-backend-5l4g.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
